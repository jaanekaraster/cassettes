<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Family Archive</title>

  <link rel="stylesheet" href="./styles.css">
</head>

<body>
  <main class="container">

    <header class="site-header">
      <h1>Family Archive</h1>
      <p>Archival recordings from the family collection.</p>
    </header>

    <section class="controls" aria-label="Archive search">
      <label for="search">Search recordings</label>

      <input
        id="search"
        type="search"
        placeholder="Search by song, person, language..."
        autocomplete="off"
      >
    </section>

    <section>
      <div class="results-header">
        <h2>Recordings</h2>
        <span id="result-count"></span>
      </div>

      <div id="recordings">
        <p>Loading archive…</p>
      </div>
    </section>

  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
